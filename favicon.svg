<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Main Blue & Sky Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- Computer Vision Framing Corners (Reticle) -->
  <path d="M 128 176 L 128 128 L 176 128" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 384 176 L 384 128 L 336 128" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 128 336 L 128 384 L 176 384" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 384 336 L 384 384 L 336 384" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Orbiting Precision Rings & Geometry -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#cyanGrad)" stroke-width="6" opacity="0.8"/>

  <!-- Central Vision / AI Diamond Aperture -->
  <path d="M 256 166 L 336 256 L 256 346 L 176 256 Z" fill="none" stroke="url(#whiteGrad)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Inner Node Intersections (AI & Positioning Grid) -->
  <line x1="256" y1="166" x2="256" y2="346" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="4 4"/>
  <line x1="176" y1="256" x2="336" y2="256" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="4 4"/>

  <!-- Central Glowing Node -->
  <circle cx="256" cy="256" r="28" fill="url(#whiteGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="14" fill="#2563eb"/>
  
  <!-- Outer Satellite Nodes (3D Coordinate Constellation) -->
  <circle cx="256" cy="166" r="8" fill="#ffffff"/>
  <circle cx="336" cy="256" r="8" fill="#ffffff"/>
  <circle cx="256" cy="346" r="8" fill="#ffffff"/>
  <circle cx="176" cy="256" r="8" fill="#ffffff"/>

  <circle cx="204" cy="204" r="6" fill="#38bdf8"/>
  <circle cx="308" cy="204" r="6" fill="#38bdf8"/>
  <circle cx="308" cy="308" r="6" fill="#38bdf8"/>
  <circle cx="204" cy="308" r="6" fill="#38bdf8"/>
</svg>
