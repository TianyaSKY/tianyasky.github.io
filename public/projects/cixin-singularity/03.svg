<text x="80" y="120" font-family="Noto Sans SC" font-size="48" font-weight="900" fill="#09152e">训练 & 推理资源占用</text>
<rect x="80" y="280" width="270" height="220" rx="22" fill="white" stroke="#4f46e5" stroke-width="3"/><text x="215" y="360" text-anchor="middle" font-family="Noto Sans SC" font-size="22" fill="#475569" font-weight="700">可训练参数</text><text x="215" y="430" text-anchor="middle" font-family="JetBrains Mono" font-size="44" font-weight="900" fill="#4f46e5">0.3%</text><text x="215" y="475" text-anchor="middle" font-family="JetBrains Mono" font-size="16" fill="#94a3b8">占总量</text><rect x="370" y="280" width="270" height="220" rx="22" fill="white" stroke="#0284c7" stroke-width="3"/><text x="505" y="360" text-anchor="middle" font-family="Noto Sans SC" font-size="22" fill="#475569" font-weight="700">权重体积</text><text x="505" y="430" text-anchor="middle" font-family="JetBrains Mono" font-size="44" font-weight="900" fill="#0284c7">48 MB</text><text x="505" y="475" text-anchor="middle" font-family="JetBrains Mono" font-size="16" fill="#94a3b8">全部 LoRA</text><rect x="660" y="280" width="270" height="220" rx="22" fill="white" stroke="#1d4ed8" stroke-width="3"/><text x="795" y="360" text-anchor="middle" font-family="Noto Sans SC" font-size="22" fill="#475569" font-weight="700">显存占用</text><text x="795" y="430" text-anchor="middle" font-family="JetBrains Mono" font-size="44" font-weight="900" fill="#1d4ed8">14.2 GB</text><text x="795" y="475" text-anchor="middle" font-family="JetBrains Mono" font-size="16" fill="#94a3b8">T4 单卡</text><rect x="950" y="280" width="270" height="220" rx="22" fill="white" stroke="#2563eb" stroke-width="3"/><text x="1085" y="360" text-anchor="middle" font-family="Noto Sans SC" font-size="22" fill="#475569" font-weight="700">首 Token</text><text x="1085" y="430" text-anchor="middle" font-family="JetBrains Mono" font-size="44" font-weight="900" fill="#2563eb">1.7 s</text><text x="1085" y="475" text-anchor="middle" font-family="JetBrains Mono" font-size="16" fill="#94a3b8">vLLM 模式</text><rect x="1240" y="280" width="270" height="220" rx="22" fill="white" stroke="#38bdf8" stroke-width="3"/><text x="1375" y="360" text-anchor="middle" font-family="Noto Sans SC" font-size="22" fill="#475569" font-weight="700">吞吐</text><text x="1375" y="430" text-anchor="middle" font-family="JetBrains Mono" font-size="44" font-weight="900" fill="#38bdf8">32 tok/s</text><text x="1375" y="475" text-anchor="middle" font-family="JetBrains Mono" font-size="16" fill="#94a3b8">stream 模式</text><text x="80" y="700" font-family="Noto Sans SC" font-size="22" fill="#475569">对比基线（同任务） · 显存 70% 降低 · 权重 92% 减小</text></svg>