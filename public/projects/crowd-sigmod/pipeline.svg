<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="8"/>
  <rect x="15" y="15" width="1170" height="590" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>

  <!-- Title Header -->
  <text x="40" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    YOLO-PGMD: Probabilistic-Guided Multi-Scale Density Network
  </text>
  <text x="40" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">
    End-to-End Stride-4 High-Fidelity Density Map Estimation &amp; Strictly Conserved Integral Counting
  </text>

  <!-- Step 1: Input -->
  <g transform="translate(40, 140)" filter="url(#shadow)">
    <rect width="130" height="340" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="130" height="36" rx="6" fill="#f1f5f9"/>
    <text x="65" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">Input Image</text>
    <text x="65" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">RGB Tensor</text>
    <text x="65" y="165" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">[B, 3, 640, 640]</text>
    <rect x="25" y="210" width="80" height="80" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <text x="65" y="255" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Dense Crowd</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 170 310 L 220 310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: YOLO Backbone -->
  <g transform="translate(220, 120)" filter="url(#shadow)">
    <rect width="170" height="380" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="170" height="36" rx="6" fill="#e0f2fe"/>
    <text x="85" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0369a1">YOLO Backbone</text>
    
    <!-- P2, P3, P4 levels -->
    <rect x="15" y="60" width="140" height="80" rx="4" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="85" y="90" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0369a1">P2 (Stride 4)</text>
    <text x="85" y="115" text-anchor="middle" font-family="monospace" font-size="10" fill="#0284c7">[B, C2, 160, 160]</text>

    <rect x="15" y="160" width="140" height="80" rx="4" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="85" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0369a1">P3 (Stride 8)</text>
    <text x="85" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#0284c7">[B, C3, 80, 80]</text>

    <rect x="15" y="260" width="140" height="80" rx="4" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="85" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0369a1">P4 (Stride 16)</text>
    <text x="85" y="315" text-anchor="middle" font-family="monospace" font-size="10" fill="#0284c7">[B, C4, 40, 40]</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 390 310 L 440 310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Multi-Scale Fusion -->
  <g transform="translate(440, 140)" filter="url(#shadow)">
    <rect width="160" height="340" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="160" height="36" rx="6" fill="#e0e7ff"/>
    <text x="80" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#3730a3">Multi-Scale Fusion</text>
    <text x="80" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">1×1 Proj + Up(P3, P4)</text>
    <text x="80" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Concat → C2f</text>
    
    <rect x="15" y="150" width="130" height="60" rx="4" fill="url(#indigoGrad)"/>
    <text x="80" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Fused Feature F</text>
    <text x="80" y="195" text-anchor="middle" font-family="monospace" font-size="10" fill="#e0e7ff">[B, 128, 160, 160]</text>

    <text x="80" y="270" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Stride-4 Maintained</text>
    <text x="80" y="290" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">High-res Preservation</text>
  </g>

  <!-- Split Paths from Fusion -->
  <path d="M 600 240 L 650 180" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 600 350 L 650 350" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Probability Head -->
  <g transform="translate(650, 110)" filter="url(#shadow)">
    <rect width="180" height="130" rx="6" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5"/>
    <rect width="180" height="32" rx="6" fill="#ffe4e6"/>
    <text x="90" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#be123c">Probability Head</text>
    <text x="90" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">Sigmoid Likelihood</text>
    <text x="90" y="85" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#e11d48">P ∈ [0, 1] (160×160)</text>
    <text x="90" y="110" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#881337">Loss: BCE + 0.2 × Dice</text>
  </g>

  <!-- Prior Guidance Flow -->
  <path d="M 740 240 L 740 280" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="745" y="265" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#e11d48">Spatial Prior</text>

  <!-- Step 5: PG-Attention + MSR -->
  <g transform="translate(650, 280)" filter="url(#shadow)">
    <rect width="180" height="230" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="180" height="32" rx="6" fill="#ccfbf1"/>
    <text x="90" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f766e">PG-Attention &amp; MSR</text>

    <rect x="15" y="45" width="150" height="48" rx="4" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="90" y="66" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f766e">ECA + P/Avg/Max</text>
    <text x="90" y="82" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#134e4a">Channel &amp; Spatial Attn</text>

    <rect x="15" y="105" width="150" height="70" rx="4" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="90" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f766e">MSR × 3 Residuals</text>
    <text x="90" y="146" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#0f766e">dilations = [1, 2, 3]</text>
    <text x="90" y="164" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#134e4a">Multi-scale Receptive Field</text>

    <text x="90" y="205" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#64748b">[B, 64, 160, 160]</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 830 395 L 880 395" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Density Head & Output -->
  <g transform="translate(880, 140)" filter="url(#shadow)">
    <rect width="270" height="340" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="270" height="36" rx="6" fill="#fef3c7"/>
    <text x="135" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#92400e">Density Output &amp; Count</text>

    <rect x="20" y="60" width="230" height="60" rx="4" fill="url(#amberGrad)"/>
    <text x="135" y="86" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Softplus Density Head</text>
    <text x="135" y="106" text-anchor="middle" font-family="monospace" font-size="10" fill="#fef3c7">D ≥ 0 : [B, 1, 160, 160]</text>

    <rect x="20" y="140" width="230" height="75" rx="4" fill="#fefce8" stroke="#fde047"/>
    <text x="135" y="165" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#854d0e">Integral Count Σ D</text>
    <text x="135" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#713f12">Exact Conservation</text>
    <text x="135" y="202" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ca8a04">Count = Σ Σ D(i, j) = N</text>

    <rect x="20" y="235" width="230" height="85" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="135" y="255" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#334155">Multi-Task Hierarchical Loss</text>
    <text x="135" y="275" text-anchor="middle" font-family="monospace" font-size="9" fill="#0284c7">L_prob + L_density(SmoothL1)</text>
    <text x="135" y="295" text-anchor="middle" font-family="monospace" font-size="9" fill="#0284c7">+ 0.5 L_count(NAE) + 0.25 L_local</text>
  </g>

</svg>